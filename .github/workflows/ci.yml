name: Candidate tests
on:
  push:
    branches:
      - hir-293-v2-tests
      - hir-307-*
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n scripts/weekly-maintenance.sh
      - run: python3 -c "import plistlib; plistlib.load(open('launchd/my.launchd.weekly-maintenance.plist','rb'))"
      - run: git diff --check
