name: Test weekly maintenance
on:
  push:
    branches:
      - hir-293-tests
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax
        run: bash -n scripts/weekly-maintenance.sh
      - name: Mocked behavior and plist structure
        run: python3 -m unittest discover -s tests -p 'test_*.py'
